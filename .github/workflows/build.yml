name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode sürümü (ör. 26.1). Boş = runner'daki en yeni"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dylib:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Xcode seç
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: |
          echo "Kurulu Xcode'lar:"
          ls -d /Applications/Xcode*.app
          if [ -n "$XCODE_VERSION" ]; then
            XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          else
            XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dylib'i derle
        run: ./dylib/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ComputerUseBridge-dylib
          path: build/ComputerUseBridge.dylib
          if-no-files-found: error
          retention-days: 30
