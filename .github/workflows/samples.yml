name: samples

# Örnek uygulamaları ve dylib'i derler, araç testlerini çalıştırır ve şunları üretir:
#   sample-ipas: düz IPA'lar (LiveContainer'a kurulup dylib tweak olarak eklenir)
#                ve ComputerUseBridge.dylib eklenmiş "-cub" IPA'lar (doğrudan kurulum için)
# IPA'lar imzasızdır.

on:
  push:
    branches: [main]
    paths:
      - "dylib/**"
      - "samples/**"
      - "tools/**"
      - "host/**"
      - "prototype/**"
      - ".github/workflows/samples.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: samples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python testleri
        run: |
          pip install "websockets>=10.4"
          python -m unittest discover -v -s tools
          python -m unittest discover -v -s prototype/host
          python -m unittest discover -v -s host
          python -m py_compile host/cub.py host/odav_demo.py

  samples:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode seç
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dylib'i derle
        run: ./dylib/build.sh

      - name: XcodeGen ile projeyi üret
        working-directory: samples
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Örnek uygulamaları derle (imzasız)
        working-directory: samples
        run: |
          for target in UIKitSample SwiftUISample WebViewSample; do
            xcodebuild -project BridgeSamples.xcodeproj -target "$target" \
              -configuration Release -sdk iphoneos \
              SYMROOT="$PWD/build/sym" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build | tail -3
          done

      - name: IPA'ları paketle
        run: |
          mkdir -p dist
          cp build/ComputerUseBridge.dylib dist/
          for target in UIKitSample SwiftUISample WebViewSample; do
            for variant in plain cub; do
              stage="$RUNNER_TEMP/stage-$target-$variant"
              rm -rf "$stage" && mkdir -p "$stage/Payload"
              cp -R "samples/build/sym/Release-iphoneos/$target.app" "$stage/Payload/"
              app="$stage/Payload/$target.app"
              name="$target.ipa"
              if [ "$variant" = cub ]; then
                python3 tools/inject_dylib.py "$app" --dylib build/ComputerUseBridge.dylib
                # Yapı geçerliliğini doğrulamak için ad-hoc imza; kurulumdan önce yeniden imzalanır.
                codesign --force --sign - "$app/Frameworks/ComputerUseBridge.dylib"
                codesign --force --sign - "$app"
                otool -L "$app/$target" | grep ComputerUseBridge
                name="$target-cub.ipa"
              fi
              (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist/$name" Payload)
            done
          done
          ls -la dist | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sample-ipas
          path: |
            dist/*.ipa
            dist/ComputerUseBridge.dylib
          if-no-files-found: error
          retention-days: 30
